name: Signed production release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and trusted release commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/site.test.cjs
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$REF_NAME" = "$DEFAULT_BRANCH" || { echo 'Dispatch production releases from the default branch.'; exit 1; }
          else
            test "$REF_NAME" = "v$VERSION" || { echo 'Tag must match version.properties.'; exit 1; }
          fi
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo 'Release commit must be merged into the default branch.'; exit 1; }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and lint (no signing secrets)
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Annotate lint failures
        if: failure()
        run: python3 scripts/report_lint.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Sign APK with temporary keystore
        env:
          VYNOX_KEYSTORE_BASE64: ${{ secrets.VYNOX_KEYSTORE_BASE64 }}
          VYNOX_KEYSTORE_PASSWORD: ${{ secrets.VYNOX_KEYSTORE_PASSWORD }}
          VYNOX_KEY_ALIAS: ${{ secrets.VYNOX_KEY_ALIAS }}
          VYNOX_KEY_PASSWORD: ${{ secrets.VYNOX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in VYNOX_KEYSTORE_BASE64 VYNOX_KEYSTORE_PASSWORD VYNOX_KEY_ALIAS VYNOX_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Required signing secret is not configured: $name"; exit 1; }
          done
          export VYNOX_KEYSTORE_PATH="$RUNNER_TEMP/vynox-release.jks"
          trap 'rm -f "$VYNOX_KEYSTORE_PATH"' EXIT
          printf '%s' "$VYNOX_KEYSTORE_BASE64" | base64 --decode > "$VYNOX_KEYSTORE_PATH"
          unset VYNOX_KEYSTORE_BASE64
          gradle --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/Vynox.apk
          (cd release-assets && sha256sum Vynox.apk > Vynox.apk.sha256)
      - name: Publish without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/vynox-release.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-test-reports
          path: app/build/reports/
  pages:
    needs: build-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
